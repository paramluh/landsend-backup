<!-- ppm_aloe_v2pure live page (10-17) = ppm_aloe_uncond.tpl.html (22317's page, copied verbatim 10-17 incl. the user's mods) with only:
     run = newest ppm/aloe-v2pure-ft/runs/ppm-aloe-v2pure-ft-j<JOB> (PPM 32B, monoplex Aloe pose on the release-v2 data: channel A empty, B generates
     speech + pose; recipe + metrics = 22317); grey reference = the finished uncond run 22317 (same recipe, Model-1 handover data, own eval set);
     NEW: the 8B SAM pose fine-tunes (v2pure main, + v2 / posev3 / posev2 when their logs exist) as coloured reference series on the four metrics
     that mean the same on both models (pose cb0 CE, pose light CE, audio cb0 CE, audio light CE; train + the 8B held-out eval = the same 3,482
     items / 113 recordings as our eval), default on; every reference is placed by FRACTION OF ITS OWN EPOCH (default x axis = fraction of epoch;
     in Step / Rows mode the references sit at the same fraction of this run's epoch) and smoothed over the same fraction of the epoch;
     own localStorage keys (ppmv2p_*); polls ppm_aloe_v2pure_live.json / ver_ppm_aloe_v2pure.txt. build_ppm_aloe_v2pure.py fills the DATA placeholder.
     Original header (ppm_aloe_uncond.tpl.html): ppm_aloe_uncond live page (10-16) = ppm_aloe_pose.tpl.html with: run = newest ppm/aloe-uncond-ft/runs/ppm-aloe-uncond-ft-j<JOB> (unconditional B:
     channel A empty, B word lane x10 in the loss, speech x1, pose x1); muted overlay on EVERY chart = the finished A-conditioned POSE run 22091 (grey thin,
     or the metric's colour at low opacity on the multi-line LR chart), same unweighted metrics; uncond note at the top of the sub line; own localStorage keys.
     Original: ppm_aloe_pose live page (10-16, standard live-curve format = ppm_aloe.tpl.html / s4qqa.tpl.html / stage3.html: same CSS, Chart.js engine, hover,
     legend toggles, ⋯ controls, drag-zoom). One run: the newest ppm/aloe-pose-ft/runs/ppm-aloe-pose-ft-j<JOB> (PPM fine-tune on the Aloe handover rows,
     POSE on channel B); ★ = that run while its job is live (derived from squeue in build_ppm_aloe_pose.py). Muted grey overlay on the main chart = the finished
     no-pose Aloe FT 21980 (reference). Eval = combined only (eval_speech/*; per-side eval_userB_ / eval_asstB_ deliberately not shown). Run parameters
     (total steps, rows/step, eval cadence, saves) come from ppm/aloe-pose-ft/PAGE_CFG.json on every rebuild; every chart's x axis runs to the last step.
     build_ppm_aloe_pose.py fills the DATA placeholder; the page polls ppm_aloe_pose_live.json every 60 s and reloads when ver_ppm_aloe_pose.txt (= template hash)
     changes. marker: ppm-aloe-pose-stdformat-v1 / ppm-aloe-uncond-v1 / ppm-aloe-v2pure-v1 / ppm-aloe-v2pure-v2 (10-17 user: plain model names
     "★ PPM 32B pose FT · Xabi’s data (current)" / "PPM 32B pose FT · handover data (old, 22317)" / "8B v2pure · Xabi’s data (ref)"; current + old +
     8B v2pure on by default on every chart, 8B v2 / posev3 / posev2 off (in the legend); legend key reset -> ppmv2p2_vis; one header line naming the
     two PPM models and what differs: data, eval set, steps) / ppm-aloe-v2pure-v3 (10-17 user: per-chart "avg X steps" box in each card header =
     centred rolling mean over X of each run's OWN optimiser steps on every train series, trailing for the last ⌊X/2⌋ points, X = 1 raw, eval raw;
     defaults = the old windows (main 25, loss / pose / audio = smooth train, step time / LR raw); per chart in localStorage ppmv2p_avg)
     / ppm-aloe-v2pure-v4 (10-17 user: the pose cb0 chart holds EXACTLY 2 curves = ★ current 32B train + 8B v2pure train, pcb0two())
     / ppm-aloe-v2pure-v5 (10-18: + run clip80 = aloe-v2pure-clip80 (s.c80): = 23051 with ONE change, the system-prompt rule (no persona text, voice
     clip on a seeded 80 % of items; 23051: 1/3); shown ONLY on the normalised word CE chart (train + combined eval, orange), next to 23051; its one-off
     step-0 identity check under 23051's prompt rule (s.c80.idchk) = one labelled diamond marker, never part of its eval curve; ★ on every clip80
     label while its job is live (squeue + no 'ended' line in RUNNING_JOB.txt); header row 1 = clip80 (job, nodes, step, s/step, ETA; "starting"
     until it exists), row 2 = 23051 as the finished 1/3-clip run (all its numbers kept); 23051 label = "PPM 32B pose FT · Xabi’s data · 1/3 voice
     clip (23051, finished)"; legend visibility keys of the renamed series map to their old keys (vkey) so stored toggles survive)
     / ppm-aloe-v2pure-v6 (10-18: + run posemono8020 = aloe-pose-mono-8020 (s.pm), "PPM · w-11488 · monoplex pose · Aloe rows · 80% clip / 20% persona":
     the 23051 recipe (v2pure monoplex) on the Aloe handover pose rows (22091's qualifying tracks, 1 item per track), prompt voice clip p0.8 / persona
     p0.2, independent draws; added exactly like clip80: normalised word CE chart only (train + combined eval, green = --pm), its one-off step-0
     identity check (s.pm.idchk, init under 23051's prompt rule; reference = 22317's step-0 eval 1.9574, same Aloe eval items + monoplex format) =
     one labelled diamond (grey = 22317's colour, green edge), never part of its eval curve; its own epoch = s.pm.max_steps (357; 23051: 200), so it
     is placed like 22317 (serA: fraction of ITS epoch; Step / Rows mode = the same fraction of 23051's); ★ while its job is live (same rule);
     header row 1 = posemono8020 (step N / 357, s/step, ETA), then clip80, then 23051; big card 420 -> 480 px (phones 440 -> 540) for its 4 legend rows) -->

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:10px 16px 40px}
.hdr{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding:4px 0 6px;font-variant-numeric:tabular-nums}
.hdr .nm{font-weight:700}
.hdr .big{font-weight:650}
.sub{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.wait{color:var(--warn);font-weight:650}

.dot.off{background:#c0392b}.dot.wt{background:#d4a017}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px}

.seg button{border:0;background:var(--btn);color:var(--fg);padding:6px 14px;font:inherit;cursor:pointer}

.card.big{grid-column:1/-1}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ct h3{margin:0;font-size:14px;font-weight:600}
.card.big .ct h3{font-size:16px}
.ct .nt{color:var(--muted);font-size:12px;font-weight:400;margin-left:6px}
.more{border:1px solid transparent;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 8px;border-radius:6px}
.card.open .more{border-color:var(--line)}
.ctl{display:none;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px;font-size:12px}
.card.open .ctl{display:flex}
.ctl button{border:1px solid var(--line);background:var(--btn);color:var(--fg);border-radius:6px;padding:3px 8px;font:inherit;cursor:pointer}

.ctr{display:inline-flex;align-items:center;gap:6px;flex-shrink:0}

.avg input{width:56px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:2px 4px;font:inherit}
.avg input:disabled{opacity:.5}
.ctl input{width:64px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:3px 5px;font:inherit}
.cv{position:relative;height:300px}
.card.big .cv{height:480px}  /* 10-18: 420 -> 480 px (posemono8020's legend rows) */
@media (max-width:640px){.cv{height:250px}.card.big .cv{height:540px}.seg button{padding:6px 10px}}  /* 10-18: big card 320 -> 440 px on phones (clip80's 4 legend rows); 440 -> 540 (posemono8020's) */
</style>

<script>
const D=__DATA__;
try{if(window.ChartZoom)Chart.register(window.ChartZoom)}catch(e){}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const S=()=>D.s||{};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const VIS=LS.get('ppmv2p2_vis',{}),OPT=LS.get('ppmv2p_opt',{});let XM=LS.get('ppmv2p_xm','fr'),SM=+LS.get('ppmv2p_sm',5)||5;
if(XM!=='st'&&XM!=='fr'&&XM!=='cv')XM='fr';
const C=(cols,k)=>(cols||[]).indexOf(k);const f=v=>(+v).toLocaleString('en-US');
const MS=()=>S().max_steps||440,RW=()=>S().rows||64;
const roll=(p,w)=>{const o=[];let t=0;for(let q=0;q<p.length;q++){t+=p[q].y;if(q>=w)t-=p[q-w].y;o.push(Object.assign({},p[q],{y:t/Math.min(q+1,w)}))}return o};
/* x: optimiser step | fraction of the epoch (step / that run's total steps) | rows seen (step × rows per step) */
const xOf=(r,M)=>XM==='cv'?(r[1]||0):XM==='fr'?r[0]/(M||1):r[0];
const ser=(rows,cols,k,M)=>{const i=C(cols,k);return i<0?[]:(rows||[]).filter(r=>r[i]!=null&&isFinite(r[i])).map(r=>({x:xOf(r,M),y:r[i],s:r[0],fr:r[0]/(M||1),cv:r[1]||0}))};
/* references (22317 + the 8B runs): placed by the fraction of THEIR OWN epoch (step / their total steps); in Step / Rows mode at the same
   fraction of this run's epoch, so curves over the same data line up in every mode. rn / rm = the reference's name / epoch steps (tooltip). */
const xA=fr=>XM==='fr'?fr:XM==='st'?fr*MS():fr*MS()*RW();
const serA=(rows,cols,k,M,R,rn)=>{const i=C(cols,k);return i<0?[]:(rows||[]).filter(r=>r[i]!=null&&isFinite(r[i])).map(r=>{const fr=r[0]/(M||1);return {x:xA(fr),y:r[i],s:r[0],fr,cv:r[0]*(R||0),rn,rm:M}})};
/* 10-17 user: per-chart "avg X steps" box (stored per chart in localStorage ppmv2p_avg): rolling mean over X optimiser steps of EVERY train series
   in the chart, each run in its OWN step units (ours / 22317 / 8B each average X of their own steps; train is logged every step, so X points = X steps);
   x unchanged (fraction of each run's epoch). Centred window over the completed history; the last ⌊X/2⌋ points of every series use a trailing window
   (no later steps yet). X = 1 = raw. Eval series stay raw points (evals are 25 / 100 steps apart). Default X = the window each chart used before. */
const rollC=(p,X)=>{X=Math.max(1,Math.round(X||1));if(X<2||!p.length)return p;const n=p.length,cs=[0];for(const q of p)cs.push(cs[cs.length-1]+q.y);
  const hl=Math.floor((X-1)/2),hr=X-1-hl,o=[];
  for(let q=0;q<n;q++){let a,b;if(q+hr<=n-1){a=Math.max(0,q-hl);b=q+hr}else{a=Math.max(0,q-X+1);b=q}o.push(Object.assign({},p[q],{y:(cs[b+1]-cs[a])/(b-a+1)}))}
  return o};
const AVG=(x=>x&&typeof x==='object'?x:{})(LS.get('ppmv2p_avg',{}));
const AV=k=>{const v=Math.round(+AVG[k]);return v>=1&&v<=1000?v:(SPEC[k].avg0||1)};
const avgTip=k=>{const s=S(),sp=SPEC[k];if(sp.noavg)return 'Eval-only chart: eval points always stay raw (no train series to average).';
  if(sp.two){const R=(s.sam||[]).find(r=>r.main)||{};return `avg X steps: rolling mean over X optimiser steps, applied to both train curves, each run in its OWN step units (32B current ${f(MS())} steps/epoch, 8B v2pure ${f(R.total||636)}); x stays at the fraction of each run’s epoch. Centred window over the completed history; the last ⌊X/2⌋ points use a trailing window (no later steps yet). X = 1 = raw. This chart shows train only. Remembered in this browser.`}
  const R8=sp.r8?(s.sam||[]):[];
  return `avg X steps: rolling mean over X optimiser steps, applied to every train series in this chart, each run in its OWN step units (${k==='nword'?`${PMRN} ${f(PMR().max_steps||357)}, clip80 ${f(C8().max_steps||MS())}, 23051 `:'current '}${f(MS())} steps/epoch, old 22317 ${f(s.ref_total||430)}`+
    (R8.length?`, 8B ${[...new Set(R8.map(R=>f(R.total||0)))].join(' / ')}`:'')+`); x stays at the fraction of each run’s epoch. Centred window over the completed history; the last ⌊X/2⌋ points of each series use a trailing window (no later steps yet). X = 1 = raw. `+
    `Eval series are NOT averaged: they stay raw points, because evals come only every ${s.eval_every||25} steps (22317: 25`+(R8.length?', 8B: 100':'')+`), so a step-window average would mix far-apart checkpoints.`+
    (k==='nword'?' The faint “raw” train line stays raw.':'')+' Remembered per chart in this browser.'};
const L=(label,data,color,o={})=>({label,data,borderColor:color,backgroundColor:color,borderWidth:o.w||1.6,borderDash:o.dash||[],pointRadius:o.pts||0,pointHoverRadius:4,pointHitRadius:6,tension:0,parsing:false,spanGaps:true,_ev:!!o.ev,_sm:!!o.sm,_pin:o.pin!==false,_det:o.det||'',yAxisID:o.ax||'y'});
/* 10-17 user: plain model names (job id stays in the hover detail). 10-18: 23051 = the finished 1/3-voice-clip run, next to clip80 */
const RST=r=>r.live?'live':r.phase==='done'?'finished':(r.phase==='ended'?'ended':(r.phase||'').startsWith('builder')?'error':'starting');
const NB=()=>{const s=S();return (s.live?'★ ':'')+`PPM 32B pose FT · Xabi’s data · 1/3 voice clip (${s.jobid||'23051'}, ${RST(s)})`};
/* clip80 (s.c80): = 23051 with ONE change, the system-prompt rule: no persona text, voice clip on a seeded 80 % of items. Normalised word CE only. */
const C8=()=>S().c80||{};
const C8NB=()=>{const c=C8();return (c.live?'★ ':'')+`clip80 · 80% voice clip, no persona (${c.jobid?'job '+c.jobid+', ':''}${RST(c)})`};
const C8DET=()=>{const c=C8();return `${c.run||'aloe-v2pure-clip80'} · job ${c.jobid||'– (not launched yet)'} · ${f(c.max_steps||200)} steps × ${c.rows||64} rows · = 23051 (same recipe, data, init, eval clips) with ONE change, the system-prompt rule: no persona text, voice clip on a seeded 80 % of items (23051: 1/3)`};
/* 10-18 posemono8020 (s.pm): the 23051 recipe (v2pure monoplex) on the Aloe handover pose rows, prompt voice clip p0.8 / persona p0.2. Normalised word CE
   only. Own epoch = s.pm.max_steps (357; 23051: 200): placed like 22317, at the fraction of ITS OWN epoch (serA; Step / Rows mode: same fraction of 23051's). */
const PMR=()=>S().pm||{};
const PMN='PPM · w-11488 · monoplex pose · Aloe rows · 80% clip / 20% persona',PMRN='w-11488 monoplex 80/20';
const PMNOTE='23051 recipe (v2pure monoplex) on Aloe handover pose rows (22091’s qualifying tracks, 1 item per track); prompt: voice clip p0.8, persona p0.2, independent draws';
const PMNB=()=>{const c=PMR();return (c.live?'★ ':'')+`${PMN} (${c.jobid?'job '+c.jobid+', ':''}${RST(c)})`};
const PMEV=()=>{const c=PMR();return (c.eval_items?f(c.eval_items)+' ':'')+'held-out Aloe handover items (22317’s eval items, not 23051’s)'};
const PMDET=()=>{const c=PMR();return `${c.run||'aloe-pose-mono-8020'} · job ${c.jobid||'– (not launched yet)'} · ${f(c.max_steps||357)} steps × ${c.rows||64} rows`+(c.train_items?` (${f(c.train_items)} train items)`:'')+` · ${PMNOTE}`};
const EVD=()=>{const s=S();return ' · eval: '+(s.eval_items?f(s.eval_items)+' held-out items, ':'held-out, ')+'combined'};
const DLIVE=()=>{const s=S();return `${s.run||''} · job ${s.jobid||'?'} · ${f(MS())} steps × ${RW()} rows · monoplex B (A empty, word lane x10) · Xabi’s Aloe pose release v2`};
/* one chart: for each metric [col, name, colour var]: the run's train (smoothed, solid) + eval (dashed + points, combined held-out eval only) */
/* + the 22091 reference (muted: grey thin, or the metric's own colour at low opacity when a chart holds several metrics), same metric, same smoothing, at its own steps */
const AL=(c,a)=>/^#[0-9a-f]{6}$/i.test(c)?c+a:c;
const REFN='PPM 32B pose FT · handover data (old, 22317)';
const RDET=()=>{const s=S();return `ppm-aloe-uncond-ft-j22317 · finished · ${f(s.ref_total||430)} steps × ${s.ref_rows||64} rows · same recipe (A empty, B word lane x10, speech x1, pose x1) on the Model-1 Aloe handover rows`+
  (s.ref_train_items?` (${f(s.ref_train_items)} train items)`:'')+` · its eval = its own `+(s.ref_eval_items?f(s.ref_eval_items)+' ':'')+`held-out handover items, NOT this run’s eval set`};
/* the 8B SAM pose FTs (s.sam, s.scols = step, cb0, light, pcb0, plight): train (smoothed over the same fraction of the epoch, solid) + held-out eval
   (dashed + points), each at the fraction of its own epoch; v2pure (main) thicker. Only on the 4 charts whose metric means the same on both models. */
const R8N=R=>R.label.replace(/ \(ref\)$/,'');
const R8DET=R=>`${R8N(R)} · SAM 8B pose FT (text upfront, one speaker) · ${f(R.total||0)} steps = 1 epoch${R.rows?` × ${R.rows} rows`:''} · ${R.note}`;
function sam8(c,hasE,X){const s=S(),out=[];if(C(s.scols,c)<0)return out;
  for(const R of (s.sam||[])){const M8=R.total||1,c8=css(R.col||'--rt1'),bw=R.main?2:1.3;
    const d=serA(R.train,s.scols,c,M8,R.rows,R8N(R));
    /* default visibility (10-17 user): 8B v2pure (main) on; 8B v2 / posev3 / posev2 off (still in the legend) */
    if(d.length)out.push(Object.assign(L(R.label+' · train',rollC(d,X),AL(c8,R.main?'e6':'b3'),{sm:X>1,w:bw,pin:!!R.main,det:R8DET(R)}),{_w:X,_r8:1,_ign:(R.warmup||0)+4+X}));
    const e=serA(R.eval,s.scols,c,M8,R.rows,R8N(R));
    if(hasE&&e.length)out.push(Object.assign(L(R.label+' · held-out eval',e,c8,{w:bw,dash:[6,4],pts:R.main?3:2,ev:1,pin:!!R.main,det:R8DET(R)+' · held-out eval (HO_EVAL): 3,482 items from the same 113 held-out recordings as our eval (3,481 clips)'}),{_r8:1}))}
  return out}
/* pose cb0 chart (10-17 user): exactly 2 curves, ★ current 32B train + 8B v2pure (main) train, both averaged over X of their own steps, x = fraction of own epoch */
function pcb0two(X){const s=S(),out=[];
  const d=ser(s.train,s.tcols,'pcb0',MS());out.push(Object.assign(L(NB()+' · train',rollC(d,X),css('--rc1'),{sm:X>1,w:2.4,det:DLIVE()}),{_w:X}));
  const R=(s.sam||[]).find(r=>r.main);
  if(R){const e=serA(R.train,s.scols,'pcb0',R.total||1,R.rows,R8N(R));out.push(Object.assign(L(R.label+' · train',rollC(e,X),AL(css(R.col||'--rt1'),'e6'),{sm:X>1,w:2,det:R8DET(R)}),{_w:X,_r8:1,_ign:(R.warmup||0)+4+X}))}
