<!-- klweb-theme (10-26, user via main: "make the live curves template have a dark mode"): shared dark / light switch for every live-curve page. Dark by default;
     the header button flips it and the choice is kept per browser (localStorage klweb_theme, one key for every page on the tunnel), so it survives the
     auto-refresh reloads. Sets <html data-theme> before the page draws (the templates' :root[data-theme=dark] colour tokens), then reloads on a flip so
     every chart rebuilds with that theme's axis / grid / legend / line colours. The button goes into [data-thm-host], else .hdr / header, else top right. -->
<script>(function(){var d=document.documentElement,t=null;try{t=localStorage.getItem('klweb_theme')}catch(e){}d.dataset.theme=t==='light'?'light':'dark';
document.addEventListener('DOMContentLoaded',function(){if(document.getElementById('thm'))return;var b=document.createElement('button'),k=d.dataset.theme==='dark';
b.id='thm';b.type='button';b.textContent=k?'☀ Light':'☾ Dark';b.title=k?'Switch to light mode (remembered in this browser)':'Switch to dark mode (remembered in this browser)';b.setAttribute('aria-label',b.title);
b.onclick=function(){try{localStorage.setItem('klweb_theme',k?'light':'dark')}catch(e){}location.reload()};
var h=document.querySelector('[data-thm-host]')||document.querySelector('.hdr')||document.querySelector('header');if(h)h.appendChild(b);else{b.style.cssText='position:fixed;top:8px;right:12px;z-index:60';document.body.appendChild(b)}})})();</script>

{const e=document.getElementById('rq');if(e){e.value=RQ;let tm=0;const ap=()=>{clearTimeout(tm);rqSet(e.value);QSS.set(RQ);rqCount();if(qCards())return;for(const k in ch)if(SPEC[k].tab===TAB){try{ch[k].resize()}catch(x){}upd(k)}};   /* 10-29 lrfix */   /* 10-28 run search (other tabs refresh when shown) */

{const e=document.createElement('div');e.id='xcnote';e.style.cssText='display:none;margin:-4px 0 12px;font-size:12px;line-height:1.45;color:var(--muted)';document.querySelector('.bar').after(e);   /* 10-23: Extrapolate contemporary controls (rule note under the tab bar) */
