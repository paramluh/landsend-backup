<!-- klweb-theme (10-26, user via main: "make the live curves template have a dark mode"): shared dark / light switch for every live-curve page. Dark by default;
     the header button flips it and the choice is kept per browser (localStorage klweb_theme, one key for every page on the tunnel), so it survives the
     auto-refresh reloads. Sets <html data-theme> before the page draws (the templates' :root[data-theme=dark] colour tokens), then reloads on a flip so
     every chart rebuilds with that theme's axis / grid / legend / line colours. The button goes into [data-thm-host], else .hdr / header, else top right. -->
<script>(function(){var d=document.documentElement,t=null;try{t=localStorage.getItem('klweb_theme')}catch(e){}d.dataset.theme=t==='light'?'light':'dark';
document.addEventListener('DOMContentLoaded',function(){if(document.getElementById('thm'))return;var b=document.createElement('button'),k=d.dataset.theme==='dark';
b.id='thm';b.type='button';b.textContent=k?'☀ Light':'☾ Dark';b.title=k?'Switch to light mode (remembered in this browser)':'Switch to dark mode (remembered in this browser)';b.setAttribute('aria-label',b.title);
b.onclick=function(){try{localStorage.setItem('klweb_theme',k?'light':'dark')}catch(e){}location.reload()};
var h=document.querySelector('[data-thm-host]')||document.querySelector('.hdr')||document.querySelector('header');if(h)h.appendChild(b);else{b.style.cssText='position:fixed;top:8px;right:12px;z-index:60';document.body.appendChild(b)}})})();</script>

<!-- PPM live page template (10-12). build_stage3.py with S3_PAGE=ppm and s3branches_ppm.json "page_tpl": "ppm.tpl.html" fills the data placeholder (D = {s3: ppm_doc.py
     output incl. ptabs (pose_tabs.py: ★ PPM, pose-x constants; POSE tab = ★ PPM vs SAM 8B only) and refs (stage-3 duplex run), dmour / dmtxd (Demeter on the stage-3 rows / packs),
     hestia (Demeter's own logged eval), samref (SAM 8B W&B snapshot)}) and polls s3live_ppm.json every 60 s; reloads when ver_s3_ppm.txt changes.
     Layout: one header line, three tabs (POSE | SPEECH | TEXT), one x-mode toggle per tab, charts with a "⋯" control drawer. Channel B everywhere.
     10-17: + the interleaved re-run (D.s3.branches run 'ppm-ilp' = ppm_doc.py on interleave-ppm/logs/ppm-ilp-*.log) as '★ Interleaved' on SPEECH / TEXT; ★ = the live run,
     PPM main (paused at 12,829) is 'PPM main (summed)' everywhere; its forecasts stay (labelled 'PPM main forecast').
     10-17 later: + the next-arch 14B run (branch 'ppm-next', next-arch/logs/ppm-next-*.log) = '★ Next-arch 14B' (live); the interleaved run (job 22813, stopped, logs/aborted) = 'Interleaved 32B (stopped)'.
     Default (10-17 simple): only '★ Next-arch 14B' and 'PPM main (summed)' training curves shown; everything else hidden (legend click toggles, saved per browser under ppm4_vis).
     10-21: PPM main's micro schedule may change between chain legs (8,1,1 = 8 pose, 1 speech, 1 text micros per step after PPM's 1,2,1): ppm_doc.py ppm.segs makes the
     main run's x piecewise in steps (SEG / spRows / poseX / x2s), branches keep PPM's first-schedule rate (brX), and ppm.marks draw a dashed line + label at each
     change on every chart (EVPLUG). No segs / marks in the data = exactly the old behaviour.
     10-21 later (user): 8,1,1 is OFF this page (ppm_doc.py keeps 8,1,1 legs out of the PPM chain) and has its own page stage3_ppm811.html = this template with
     PAGE='ppm811' (P8; s3branches_ppm811.json "replace"): ★ = the 8,1,1 legs (labels shown as '★ 8,1,1'), the PPM main chain as the dimmed 'ref · PPM main'
     branch (its own steps / rows), the switch mark from ppm.marks, its own CRITICAL tab (CRIT8), x in steps, x range from shortly before the switch,
     view state under 'ppm811:' localStorage keys.
     10-21 PAGE='ppm14b' (P14; s3branches_ppm14b.json "replace"): ★ = the ppm14b run (PPM architecture on a Qwen3-14B backbone, summed input, speech + text, no pose;
     main doc = ppm_doc.py on ppm/ppm14b via "main_env"), shown as '★ ppm14b'; the INTL 14B run (branch 'ppm-next', stopped at 6,242) = 'ref · INTL 14B' on every chart (SL);
     its own CRITICAL tab (CRIT14: eval normalised word CE per eval set, cb0 / light / PAD evals, train curve, ★ − ref difference and rate (SG14), B-depends-on-A);
     x = steps | speech rows | epochs (both runs 256 speech rows / step, the same data plan); no POSE / CHECKPOINTS / BACKUPS tabs, no GenghisBench, no INTL forecast
     from the difference (fitAdd), no PPM-main probe points; Demeter / stage-3 refs off ("refs": false); red decision banner = klweb/decision_ppm14b.txt (empty = none);
     view state under 'ppm14b:' localStorage keys.
     10-21 later (user) P14: + PPM 32B = the PPM main chain (s3branches_ppm14b.json branch run 'ppm-v1', ppm_doc.py PPM_SCHED=ppm: jobs 18873 … 26325, 1,2,1
     schedule, ends at its 8,1,1 switch, step 16,861; the 8,1,1 legs never enter it) as a second reference in its own colour (--p32), label 'PPM 32B' (P32 / DP32):
     eval series on every CRITICAL eval chart (crit14), train + eval on SPEECH / TEXT and in B-depends-on-A (RUNS), not in step time; no dotted trends (its data
     stops at the switch); a dashed marker at the switch (EVS); header part + a "what matches" note under the tab bar (p32note). x = its own steps / steps × 256
     speech rows (brX): same speech rows per step and the same per-step speech row order as ppm14b / INTL. Other pages: unchanged (P32() is null off P14).
     10-23 (user) every page: per-chart drawer "x log" next to "y log" (OPT xlog, saved like y log): logarithmic x in every x mode; axis from the smallest positive x shown.
     10-23 (user) PAGE='aloe32' (PA; s3branches_aloe32.json "replace", aloe_doc.py): the Aloe FT page in this style (★ live Aloe FT + every reference FT as a
     branch; charts made from the metrics the runs log; CRITICAL / EVALS / TRAIN / LR tabs; header countdowns; decision banner); see the PA block.
     10-23 (user: "next to sam sep can you put voxtral and the base checkpoint") PA only: reference 26232 first after the ★ (config order; its LR groups on the
     LR chart via branch "pass" lr) + config "base_line" = a flat dashed "base 16861 (step 0)" line on every eval chart (chA), kept inside the y range (fitRange).
     10-24 (main) PA only: PPMVOX checkpoint evals on the Aloe eval as points (config "ckpt_points" -> s3 ckpt_pts): own first CRITICAL chart (ckA).
     10-24 (PPMVOX lead) PAGE='ppm' only (PV): the PPMVOX run (branch 'ppmvox-v1', from PPM's step 16,861) = ★ while live, on every chart via RUNS + LR + header
     + CRITICAL podcast / text evals + its own PPMVOX tab; see the PV block. Before its first metrics the PPM page is exactly as before.
     10-23 (user) every page: header toggle "Extrapolate contemporary" (off by default = the page as before; ppm6_xc / ppm6_xcs / ppm6_xct per browser): each curve's
     dotted-trend rule (trendOf) refitted on its points at steps ≤ s only (s = the ★ live run's latest step, or set in the header), dashed from there; points
     after s = a dimmed copy of the curve (_xcd); a line at s; a readout per chart (XC, xcBuild, xcAdd, xcCap, XCPLUG). trendPL results cached (TPLM). -->

<script>
const D=__DATA__;
const PAGE='ppm',P8=PAGE==='ppm811',P14=PAGE==='ppm14b',PA=PAGE==='aloe32',PV=PAGE==='ppm',LSP=P8?'ppm811:':P14?'ppm14b:':PA?'aloe32:':'';   /* 10-21: page mode (s3branches_ppm811.json "replace" -> 'ppm811' = the 8,1,1 page; its view state under its own keys) */
try{if(window.ChartZoom)Chart.register(window.ChartZoom)}catch(e){}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const S=()=>D.s3||{},PP=()=>S().ppm||{},PT=()=>S().ptabs||{runs:[]};
const LS={get(k,d){try{const v=localStorage.getItem(LSP+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(LSP+k,JSON.stringify(v))}catch(e){}}};
let TAB=LS.get('ppm5_tab','critical');const XM=Object.assign(P8?{pose:'st',speech:'st',text:'st',critical:'st'}:{pose:'ep',speech:'st',text:'st'},LS.get('ppm2_xm',{}));const VIS=LS.get('ppm4_vis',{}),OPT=LS.get('ppm2_opt',{});
const C=(cols,k)=>(cols||[]).indexOf(k);
let XMAX=(v=>v>0?v:null)(+LS.get('ppm3_xmax',0));   /* 10-17: header 'x-axis to step' box: every chart's x range ends at this step (wins over Fit to ★ / forecast extent; y still fits the visible data in range) */
let SM=+LS.get('ppm2_sm',10)||10;   /* header smoothing: trailing N-step mean of the training curves (evals unsmoothed; forecasts always fit 10-step means) */
const roll=(p,w)=>{const o=[];o._raw=p;let t=0,a=0;const bs=p.every(z=>z.s!=null);   /* 10-17: trailing mean over w optimiser STEPS (s-w, s]; w 1 = raw */
  for(let q=0;q<p.length;q++){t+=p[q].y;if(bs)while(p[q].s-p[a].s>=w){t-=p[a].y;a++}else if(q-a>=w){t-=p[a].y;a++}o.push({x:p[q].x,y:t/(q-a+1),s:p[q].s})}return o};
const AVG=(v=>v&&typeof v==='object'?v:{})(LS.get('ppm5_avg',{}));   /* 10-17: per-chart 'avg X steps' (title row box): overrides the header smooth for that chart's training series; empty = header smooth */
const ser=(rows,cols,k,xf)=>{const i=C(cols,k),o=i<0?[]:(rows||[]).filter(r=>r[i]!=null&&isFinite(r[i])).map(r=>({x:xf(r),y:r[i],s:r[0]}));o._xf=xf;return o};   /* 10-21: _xf = the x function (trendOf) */
const f=v=>(+v).toLocaleString('en-US');
/* serT: ser + per-point hover details t (ex = [[name, col]]: that row's other probe values) */
const serT=(rows,cols,k,xf,ex)=>{const o=serT0(rows,cols,k,xf,ex);o._xf=xf;return o};
const serT0=(rows,cols,k,xf,ex)=>{const i=C(cols,k),js=(ex||[]).map(([n,c])=>[n,C(cols,c)]).filter(([,j])=>j>=0);return i<0?[]:(rows||[]).filter(r=>r[i]!=null&&isFinite(r[i])).map(r=>({x:xf(r),y:r[i],s:r[0],t:js.filter(([,j])=>r[j]!=null).map(([n,j])=>`${n} ${n.startsWith('Δ')&&r[j]>=0?'+':''}${(+r[j]).toPrecision(3)}`).join(' · ')}))};
/* ---- x per tab: POSE = each run's own pose epoch / clip-hours / steps; SPEECH + TEXT = each run's own (speech) epoch / steps ---- */
const xm=()=>XM[TAB]||'st';
const SAM=D.samref&&D.samref.cb_eval?D.samref:null,SPL=(SAM&&SAM.planned)||69397,SAM_EPOCH_H=341000;   /* 10-20 audit: 357,737 h × 0.956 (SAM's packer drops a clip at every row close, ≥ 4.4% of positions) × 0.998 (rows that never ran): an estimate, shown as ≈ */
const SAM_SP_NOTE='SAM is text-upfront TTS: sees the whole transcript before audio; PPM sees time-aligned words 2 frames ahead, so speech curves are not like-for-like';   /* 10-20 audit: on SAM 8B's speech series (POSE tab speech-on-pose-rows charts), in its detail and hover */
/* 10-21 (8,1,1): ppm.segs (ppm_doc.py; only when PPM main's GA changed between legs) = [{s, sp, po, sp0, po0}]: from step s on, sp speech / po pose rows per step,
   sp0 / po0 = rows at step s. The main run's x (epochs, clip-hours) is then piecewise in steps: the PPM legs keep their x, the new legs continue from them */
const SEG=()=>{const g=PP().segs;return g&&g.length>1?g:null};
const segAt=(G,s)=>{let g=G[0];for(const q of G)if(s>=q.s)g=q;return g};
const poseX=run=>{const x=(run&&run.x)||{},rps=x.pose_rows_per_step||128,er=x.pose_epoch_rows||2206848,ch=x.clip_h_per_row||0.1616,G=run&&run.id==='main'?SEG():null;
  if(G){const xf=r=>{const s=r[0],m=xm();if(m==='st')return s;const g=segAt(G,s),R=g.po0+(s-g.s)*g.po;return m==='ep'?R/er:R*ch};xf._main=1;return xf}
  return r=>{const s=r[0],m=xm();return m==='ep'?s*rps/er:m==='h'?s*rps*ch:s}};
const samX=r=>{const m=xm();return m==='ep'?r[0]/SPL:m==='h'?r[0]*SAM_EPOCH_H/SPL:r[0]};
