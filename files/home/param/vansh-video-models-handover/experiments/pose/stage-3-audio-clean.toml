# dataloading
root_dir = '/mnt/somfs/pretrain-ds'
clipnames_root = '/mnt/somfs/pretrain-ds/csvs'

# buckets — stage 3
buckets.hands = ['clean-orig', 'caption-orig']
buckets.hands_good_framing = ['clean-orig', 'caption-orig']
buckets.perfect_framing = ['clean-orig', 'caption-orig']
buckets.face = ['clean-orig', 'caption-orig', 'object-orig']
pose = 'v2'

dup_seconds = 3.0

# eval
eval_buckets.perfect_framing = ['clean-orig-eval']
eval_every_n_steps = 2000
eval_step_zero = true
num_dataloader_workers = 4
eval_num_dataloader_workers = 4
save_every_n_steps = 5000
save_optimizer_every_n_steps = 10000
output_dir = '/mnt/somfs/hands/pose-checkpoints/wan22-production-model/stage-3-redone/'

# video continuation
attention_sink = true
bounded_history = true
num_history = 8
num_present = 8

# hyperparameters
epochs = 4
micro_batch_size_per_gpu = 4
eval_micro_batch_size_per_gpu = 4
gradient_accumulation_steps = 4
gradient_clipping = 1.0
warmup_steps = 5000
lr_scheduler = 'cosine'
lr = 5e-5
min_lr = 1e-6
ema_decay = 0.9999

# deepspeed
master_port = 29517
activation_checkpointing = true
activation_checkpoint_skip = 30
compile_blocks = true
partition_method = 'parameters'
pipeline_stages = 1
zero_stage = 1

[model]
type = 'wan_5b_vidcon_variable'
arch = 'wan_5b'
checkpoint_path = '/mnt/somfs/hands/pose-checkpoints/wan22-production-model/stage-2/run_4/step215000/model_ema.safetensors'
audio_conditioning = true
pose_conditioning = true

[model.audio]
model_name = 'kyutai/mimi'
in_dim = 512
num_codebooks = 16
min_codebooks = 8
num_layers = 4
cross_attention_codes = 4
drop = 2
injection_offset = 2
injection_interval = 3
max_blocks = 9
initialization = 'zero'

[wandb]
project = 'wan22-5b-low-resolution-pretrain'
run_name = 'phase-3-redone'

[optimizer]
type = 'adamw'
betas = [0.9, 0.99]
weight_decay = 1e-6
eps = 1e-8

[[optimizer.groups]]
prefix = 'audio_encoder.'
warmup_steps = 1000
decay_start = 5000

[[optimizer.groups]]
prefix = 'audio_adapter.'
warmup_steps = 1000
decay_start = 5000
