# dataloding
root_dir = '/mnt/somfs/pretrain-ds'
clipnames_root = '/mnt/somfs/pretrain-ds/csvs'

# buckets — stage 2
buckets.hands = ['both-orig', 'both-unorig', 'object-orig', 'object-unorig', 'clean-unorig', 'caption-unorig']
buckets.hands_good_framing = ['both-orig', 'both-unorig', 'object-orig', 'object-unorig', 'clean-unorig', 'caption-unorig']
buckets.perfect_framing = ['both-orig', 'both-unorig', 'object-orig', 'object-unorig', 'clean-unorig', 'caption-unorig']

# eval
eval_buckets.perfect_framing = ['clean-orig-eval']
eval_every_n_steps = 2000
eval_step_zero = true
num_dataloader_workers = 4
eval_num_dataloader_workers = 4
save_every_n_steps = 5000
save_optimizer_every_n_steps = 30000
output_dir = '/mnt/somfs/hands/pose-checkpoints/wan22-production-model/stage-2/'

# video continuation
attention_sink = true
num_history = 8
num_present = 8

# hyperparameters
epochs = 3
micro_batch_size_per_gpu = 4
eval_micro_batch_size_per_gpu = 4
gradient_accumulation_steps = 2
gradient_clipping = 1.0
warmup_steps = 3000
lr_scheduler = 'cosine'
lr = 8e-5
min_lr = 1e-5
ema_decay = 0.9999

# deepspeed
master_port = 29517
activation_checkpointing = true
activation_checkpoint_skip = 30
compile_blocks = true
partition_method = 'parameters'
pipeline_stages = 1
zero_stage = 1

[model]
type = 'wan_5b_vidcon_variable'
arch = 'wan_5b'
checkpoint_path = '/mnt/somfs/hands/pose-checkpoints/wan22-production-model/stage-1/run_1/step91247/model_ema.safetensors'
audio_conditioning = false
pose_conditioning = true

[wandb]
project = 'wan22-5b-low-resolution-pretrain'
run_name = 'phase-2-3-epochs-warm'

[optimizer]
type = 'adamw_optimi'
betas = [0.9, 0.99]
weight_decay = 1e-4
eps = 1e-8

[[optimizer.groups]]
prefix = 'pose_patch_embedding.'
lr = 8e-5
warmup_steps = 1500
decay_start = 3000