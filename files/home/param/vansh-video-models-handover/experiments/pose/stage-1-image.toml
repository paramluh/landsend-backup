# dataloding
root_dir = '/mnt/somfs/pretrain-ds'
clipnames_root = '/mnt/somfs/pretrain-ds/csvs'

# buckets — stage 1
# buckets.hands = ['clean-orig']
buckets.perfect_framing = ['parked-orig', 'parked-unorig']
buckets.hands_good_framing = ['parked-orig', 'parked-unorig']

# eval
eval_buckets.perfect_framing = ['clean-orig-eval']
eval_every_n_steps = 2000
num_dataloader_workers = 4
eval_num_dataloader_workers = 4
save_every_n_steps = 5000
save_optimizer_every_n_steps = 30000
output_dir = '/mnt/somfs/hands/pose-checkpoints/wan22-production-model/stage-1/'

# video continuation
attention_sink = true
num_history = 8
num_present = 8

# hyperparameters
epochs = 2
micro_batch_size_per_gpu = 4
eval_micro_batch_size_per_gpu = 4
gradient_accumulation_steps = 2
gradient_clipping = 1.0
warmup_steps = 5000
lr_scheduler = 'cosine'
lr = 1.0e-4
min_lr = 5e-5
ema_decay = 0.9999

# deepspeed
master_port = 29517
activation_checkpointing = true
activation_checkpoint_skip = 30
compile_blocks = true
partition_method = 'parameters'
pipeline_stages = 1
zero_stage = 1

[model]
type = 'wan_5b_vidcon_variable'
arch = 'wan_5b'
checkpoint_path = './wan22-5b-weights'
audio_conditioning = false
pose_conditioning = false

[wandb]
project = 'wan22-5b-low-resolution-pretrain'
run_name = 'stage-1-2-epochs'

[optimizer]
type = 'adamw_optimi'
betas = [0.9, 0.99]
weight_decay = 1e-6
eps = 1e-8
