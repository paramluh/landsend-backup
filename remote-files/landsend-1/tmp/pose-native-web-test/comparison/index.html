<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Held-out speech & pose comparison</title>
<style>
:root{color-scheme:light;--ink:#182a30;--muted:#66757a;--line:#dce4e4;--accent:#16675b}*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:var(--ink);font:15px/1.5 system-ui,sans-serif}header,main{max-width:1320px;margin:auto;padding:30px 28px}header{padding-bottom:15px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:12px;font-weight:700}h1{font-size:clamp(27px,4vw,42px);letter-spacing:-.04em;margin:8px 0 12px;line-height:1.15}h2{font-size:22px;margin:0 0 6px}p{margin:8px 0}.muted{color:var(--muted)}#progress{display:flex;align-items:center;gap:12px;margin:22px 0 10px}progress{width:200px;max-width:40vw;height:7px;accent-color:var(--accent)}.legend{display:grid;grid-template-columns:repeat(var(--model-count,3),1fr);gap:20px;padding-top:22px}.legend div{border-top:2px solid var(--line);padding-top:12px}.legend b{display:block;margin-bottom:4px}.legend p{font-size:13px;color:var(--muted)}section{background:white;border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:26px}.cliptop{display:flex;align-items:start;justify-content:space-between;gap:20px}.tools{display:flex;gap:8px;flex-wrap:wrap}button{background:white;border:1px solid #cbd9d7;border-radius:7px;padding:7px 11px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}button:hover{background:#eaf3f0}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:repeat(var(--model-count,3),minmax(0,1fr));gap:18px;margin-top:18px}.cell{min-width:0}.label{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:14px;margin-bottom:8px}.pill{font-size:11px;font-weight:500;background:#e7f2ed;color:#23654b;padding:3px 7px;border-radius:20px}.pending{aspect-ratio:256/480;display:grid;place-items:center;background:linear-gradient(140deg,#f0f4f3,#e5ece9);border:1px solid var(--line);border-radius:9px;color:#758780}.player{width:100%;display:block;aspect-ratio:256/480;background:#15231f;border-radius:9px;object-fit:contain}.under{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;margin-top:8px}.under a{color:var(--accent)}details{margin-top:14px;font-size:13px}summary{cursor:pointer;color:var(--accent)}.transcript{white-space:pre-wrap;line-height:1.65;max-height:230px;overflow:auto}.meta{white-space:pre-wrap;overflow:auto;font-size:11px;padding:10px;background:#f5f7f7;border-radius:6px;max-height:250px}footer{text-align:center;color:var(--muted);font-size:12px;padding:12px 0 35px}#error{color:#9e3e35}.clipid{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}@media(max-width:700px){header,main{padding:20px 15px}.legend{gap:12px}.legend p{font-size:11px}section{padding:16px}.grid{gap:9px}.label{display:block;font-size:12px}.pill{display:inline-block;margin-top:3px}.under{flex-wrap:wrap}.cliptop{display:block}.tools{margin-top:10px}.pending{font-size:12px}.legend b{font-size:12px}}
.native .grid{max-width:900px;margin-left:auto;margin-right:auto}.gallery-nav{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0}.gallery-nav a{color:var(--accent)}.gallery-nav[hidden]{display:none}
</style></head><body>
<header><div class="eyebrow">Model comparisons · 28 October 2026</div><h1 id="title">Held-out speech & pose comparison</h1><p id="note" class="muted">Loading comparison manifest…</p><div id="progress"><strong id="count">0 videos ready</strong><progress id="bar" max="24" value="0"></progress><span id="updated" class="muted"></span></div><p id="error"></p><nav id="gallery-nav" class="gallery-nav" hidden><a id="controlled-url">Controlled · 24 videos</a><a id="native-url">Native · 16 videos</a></nav><p id="studio-link" hidden><a id="studio-url" style="color:var(--accent);font-weight:650">Request a new video →</a></p><div id="legend" class="legend"></div></header>
<form id="login" style="display:none;max-width:500px;margin:20px auto;padding:20px"><label>Access token <input id="token" type="password" autocomplete="current-password" required style="width:100%;padding:10px;margin:10px 0"></label><button>Open comparison</button></form><main id="clips"></main><footer>Videos appear automatically as completed files are published. Each player contains its own generated audio.</footer>
<script>
const $=id=>document.getElementById(id);let revision='',models=[],cells=new Map();const nativePage=location.pathname==='/native-comparison',manifestPath=nativePage?'/native-manifest.json':'/manifest.json';document.body.classList.toggle('native',nativePage);
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function details(label,text,cls){const d=el('details');d.append(el('summary','',label),el('div',cls||'transcript',text));return d}
function rowVideos(row){return [...row.querySelectorAll('video')]}
function makeRow(c){const row=el('section');row.dataset.clip=c.id;const top=el('div','cliptop'),heading=el('div');heading.append(el('h2','',c.title||c.id),el('div','clipid',c.id));top.append(heading);const tools=el('div','tools');const play=el('button','','Play ready videos together');play.onclick=()=>{rowVideos(row).forEach((v,i)=>{v.currentTime=0;v.muted=i!==0;v.play().catch(()=>{})})};const stop=el('button','','Pause all');stop.onclick=()=>rowVideos(row).forEach(v=>v.pause());tools.append(play,stop);top.append(tools);row.append(top);if(c.transcript)row.append(details('Transcript',c.transcript));if(c.provenance)row.append(details('Sample provenance',JSON.stringify(c.provenance,null,2),'meta'));const grid=el('div','grid');for(const m of models){const cell=el('div','cell');cell.append(el('div','label',m.label),el('div','pending','Waiting for render'));grid.append(cell);cells.set(c.id+'|'+m.id,{node:cell,hash:null,row})}row.append(grid);$('clips').append(row)}
function voice(c){if(!c.voice_reference)return;const state=cells.get(c.id+'|'+models[0].id);if(!state||state.row.querySelector('.voice'))return;const box=el('div','voice');box.style.marginTop='14px';box.append(el('b','','Common 8-second voice reference'));const audio=el('audio');audio.controls=true;audio.preload='none';audio.src=c.voice_reference.audio;audio.style.display='block';audio.style.width='100%';audio.style.maxWidth='500px';audio.style.marginTop='6px';box.append(audio,el('div','muted',c.voice_reference.description));state.row.insertBefore(box,state.row.querySelector('.grid'))}
function fill(c,m,o){const state=cells.get(c.id+'|'+m.id);if(!state||!o)return;if(o.status!=='complete'){if(state.hash!==null){state.node.querySelectorAll('video').forEach(v=>v.pause());state.node.replaceChildren(el('div','label',m.label),el('div','pending'));state.hash=null}const label={pending:'Waiting for render',generating:'Generating…',failed:'Render failed'}[o.status]||'Waiting for render';const pending=state.node.querySelector('.pending');if(pending)pending.textContent=label+(o.message?' · '+o.message:'');return}if(state.hash===o.sha256){const shown=state.node.querySelector('details .meta');if(shown)shown.textContent=JSON.stringify(o.metadata,null,2);return;}state.hash=o.sha256;const node=state.node;node.replaceChildren();const label=el('div','label',m.label);label.append(el('span','pill',o.seconds.toFixed(2)+' s'));const v=el('video','player');v.controls=true;v.preload='none';v.playsInline=true;v.poster=o.poster;v.src=o.video;const under=el('div','under');under.append(el('span','muted',`${o.width} × ${o.height} · ${o.frames||'?'} frames`));const listen=el('button','','Listen to this');listen.onclick=()=>{rowVideos(state.row).forEach(x=>x.muted=x!==v);v.muted=false;v.play().catch(()=>{})};under.append(listen);const link=el('a','','Open video');link.href=o.video;link.target='_blank';link.rel='noopener';under.append(link);node.append(label,v,under);if(o.metadata?.text_mode==='native'){if(typeof o.metadata.supplied_transcript==='string')node.append(details('Upfront transcript supplied',o.metadata.supplied_transcript));node.append(details('Generated transcript',o.metadata.generated_transcript||'No words were generated.'))}if(o.metadata&&Object.keys(o.metadata).length)node.append(details('Run details',JSON.stringify(o.metadata,null,2),'meta'))}
async function update(){try{const r=await fetch(manifestPath,{cache:'no-store'});if(r.status===401){$('login').style.display='block';$('note').textContent='Open the shared access link or enter its token to view this comparison.';return}if(!r.ok)throw new Error('Manifest not available yet');$('login').style.display='none';const d=await r.json();$('error').textContent='';if(d.updated_at===revision)return;revision=d.updated_at;$('title').textContent=d.title;$('note').textContent=d.note;if(d.request_studio_url){const u=new URL(d.request_studio_url,location.origin);if(u.protocol==='https:'||u.origin===location.origin){$('studio-url').href=u.href;$('studio-link').hidden=false}}models=d.models;document.documentElement.style.setProperty('--model-count',models.length);if(d.native_comparison_available&&d.request_studio_url){const base=new URL(d.request_studio_url,location.origin);for(const [id,path] of [['controlled-url','/comparison'],['native-url','/native-comparison']]){const u=new URL(path,base);if(base.origin!==location.origin)u.hash=base.hash;$(id).href=u.href} $('gallery-nav').hidden=false}if(!cells.size){$('legend').replaceChildren(...models.map(m=>{const x=el('div');x.append(el('b','',m.label),el('p','',m.description));return x}));d.clips.forEach(makeRow)}let done=0;for(const c of d.clips){voice(c);for(const m of models){const o=c.outputs[m.id];if(o&&o.status==='complete')done++;fill(c,m,o)}}const total=d.clips.length*models.length;$('count').textContent=`${done} / ${total} videos ready`;$('bar').max=total;$('bar').value=done;$('updated').textContent=done===total?'Complete':'Updating live'}catch(e){$('error').textContent=e.message+' · retrying automatically'}}
async function login(token){const r=await fetch('/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok)throw new Error('Invalid access token');$('token').value='';await update()}$('login').onsubmit=async e=>{e.preventDefault();try{await login($('token').value)}catch(e){$('error').textContent=e.message}};const access=new URLSearchParams(location.hash.slice(1)).get('token');if(access){history.replaceState(null,'',location.pathname);login(access).catch(e=>$('error').textContent=e.message)}else update();setInterval(update,10000);
</script></body></html>
